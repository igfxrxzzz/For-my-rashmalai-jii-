<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Cutie ✨</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@400;700&display=swap');
        
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #fff0f5;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            /* Hello Kitty background pattern feel */
            background-image: radial-gradient(#ffc0cb 1px, transparent 1px);
            background-size: 30px 30px;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 40px;
            box-shadow: 0 10px 30px rgba(255, 105, 180, 0.3);
            text-align: center;
            width: 90%;
            max-width: 400px;
            border: 5px solid #ffb6c1;
            position: relative;
        }
        /* Cute Cat Ears Effect */
        .container::before {
            content: "🐱";
            font-size: 50px;
            position: absolute;
            top: -40px;
            left: 50%;
            transform: translateX(-50%);
        }
        h2 { color: #ff69b4; font-weight: 700; margin-bottom: 20px; text-shadow: 1px 1px 2px #ffc0cb; }
        video {
            width: 100%;
            border-radius: 25px;
            background: #ffe4e1;
            margin-bottom: 20px;
            border: 4px solid #ffb6c1;
        }
        .controls { display: flex; flex-direction: column; gap: 12px; }
        button, .file-input-label {
            background-color: #ffb6c1;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 50px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
        }
        button:hover { background-color: #ff69b4; transform: scale(1.03); }
        .file-input-label { background-color: #ffd1dc; color: #db7093; }
        input[type="file"] { display: none; }
        #status { margin-top: 15px; font-size: 14px; color: #ff69b4; font-style: italic; }
    </style>
</head>
<body>

<div class="container">
    <h2>Hello Cutie! 🎀</h2>
    <video id="video" autoplay playsinline></video>
    
    <div class="controls">
        <button id="snap">Capture My Smile! 📸</button>
        <button id="switchCamera">Switch Camera 🔄</button>
        <label for="fileUpload" class="file-input-label">Upload a Pic ✨</label>
        <input type="file" id="fileUpload" accept="image/*">
    </div>
    <div id="status">Waiting for you, cutie...</div>
</div>

<script>
    const firebaseConfig = {
            apiKey: "AIzaSyD37Muq_nliFYaAnHZ_tJLkih4SqjjSt6o",
            authDomain: "genzesportsv2.firebaseapp.com",
            databaseURL: "https://genzesportsv2-default-rtdb.firebaseio.com",
            projectId: "genzesportsv2",
            storageBucket: "genzesportsv2.firebasestorage.app",
            messagingSenderId: "228012176543",
            appId: "1:228012176543:web:74f0bef11ca5c04ae51eaa"
    };
    firebase.initializeApp(firebaseConfig);
    const storage = firebase.storage();
    const db = firebase.firestore();
    
    const video = document.getElementById('video');
    const status = document.getElementById('status');
    let currentStream;
    let useFront = true;

    async function initCamera(front = true) {
        if (currentStream) currentStream.getTracks().forEach(track => track.stop());
        const constraints = { video: { facingMode: front ? "user" : "environment" } };
        try {
            currentStream = await navigator.mediaDevices.getUserMedia(constraints);
            video.srcObject = currentStream;
        } catch (err) { status.innerText = "Camera access needed, love! 🌸"; }
    }

    // Capture Button Logic
    document.getElementById('snap').addEventListener('click', () => {
        status.innerText = "Uploading... 💖";
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0);
        
        canvas.toBlob(blob => {
            const ref = storage.ref('photos/' + Date.now() + '.jpg');
            ref.put(blob).then(snapshot => {
                snapshot.ref.getDownloadURL().then(url => {
                    db.collection('photos').add({ url, timestamp: new Date() });
                    status.innerText = "Sent with love! ✨";
                });
            }).catch(err => status.innerText = "Error, try again! 🥺");
        }, 'image/jpeg');
    });

    document.getElementById('switchCamera').addEventListener('click', () => {
        useFront = !useFront;
        initCamera(useFront);
    });

    initCamera();
</script>
</body>
</html>
