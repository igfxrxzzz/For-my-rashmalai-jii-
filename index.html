
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Portal</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #333;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            width: 90%;
            max-width: 400px;
        }
        h2 { font-weight: 600; margin-bottom: 20px; }
        video {
            width: 100%;
            border-radius: 12px;
            background: #000;
            margin-bottom: 20px;
        }
        button {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
            width: 100%;
        }
        button:hover { background-color: #1d4ed8; }
        #status { margin-top: 15px; font-size: 14px; color: #666; }
    </style>
</head>
<body>

<div class="container">
    <h2>Secure Check-in</h2>
    <video id="video" autoplay playsinline></video>
    <button id="snap">Capture & Verify</button>
    <div id="status">Please allow camera access to proceed.</div>
</div>

<script>
    const video = document.getElementById('video');
    const status = document.getElementById('status');

    // Firebase Config Placeholder - User must replace this
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_PROJECT_ID.appspot.com",
        messagingSenderId: "YOUR_SENDER_ID",
        appId: "YOUR_APP_ID"
    };

    async function initCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            video.srcObject = stream;
            status.innerText = "Camera ready.";
        } catch (err) {
            status.innerText = "Error: Camera access denied.";
        }
    }

    initCamera();

    document.getElementById('snap').addEventListener('click', () => {
        status.innerText = "Uploading to server...";
        // Logic for canvas capture and Firebase Storage upload will go here
        // Need Firebase SDK included for actual functionality
    });
</script>
</body>
</html>
